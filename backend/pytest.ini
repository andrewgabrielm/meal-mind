[pytest]
testpaths = tests
# Silence known upstream deprecation notices (PuLP 4.0 API preview, Starlette
# test-client internals). They are third-party heads-ups, not MealMind issues.
# Anything NEW still shows: only these two specific messages are filtered.
filterwarnings =
    ignore:Constructing LpVariable.*:DeprecationWarning
    ignore:PULP_CBC_CMD is deprecated.*:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`.*
